<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 20px;
            color: #334155;
        }

        .card {
            background: #ffffff;
            max-width: 440px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .beer-icon {
            font-size: 72px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(245, 158, 11, 0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }

        h1 {
            color: #0f172a;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .highlight {
            display: inline-block;
            background: #fef3c7;
            color: #b45309;
            font-weight: 700;
            font-size: 16px;
            padding: 8px 18px;
            border-radius: 50px;
            margin-bottom: 20px;
            border: 1px solid #fde68a;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            margin-bottom: 28px;
        }

        button {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.5);
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 25px -5px rgba(245, 158, 11, 0.6);
            background: linear-gradient(135deg, #fbbf24 0%, #b45309 100%);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="beer-icon">🍺</div>
        <h1>¡Bienvenido a mi página web!</h1>
        <div class="highlight">Aquí está tu práctica</div>
        <p>Mi primera página publicada en GitHub.</p>
        <span class="badge">Hosting gratuito con GitHub Pages</span>
        
        <button onclick="alert('¡Salud! 🍻 Hola mundo')">
            ¡Salud! Haz clic aquí
        </button>
    </div>

</body>
</html>
