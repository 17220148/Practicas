
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f0f2f5;
    font-family: Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.aviso {
    text-align: center;
    padding: 14px;
    background: #fff3cd;
    color: #664d03;
    font-size: 14px;
    border-bottom: 1px solid #ffda6a;
}

.principal {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 35px 15px;
}

.logo {
    color: #0866ff;
    font-size: 55px;
    font-weight: bold;
    text-decoration: none;
    letter-spacing: -2px;
    margin-bottom: 20px;
}

.tarjeta {
    width: 432px;
    max-width: 100%;
    background: white;
    border-radius: 9px;
    box-shadow: 0 3px 15px #00000020;
    overflow: hidden;
}

.encabezado {
    text-align: center;
    padding: 18px;
    border-bottom: 1px solid #dadde1;
}

.encabezado h2 {
    font-size: 25px;
    margin: 0;
}

.encabezado p {
    font-size: 15px;
    color: #606770;
    margin: 8px 0 0;
}

.contenido {
    padding: 18px;
}

.campo {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    background: #f5f6f7;
    border: 1px solid #ccd0d5;
    border-radius: 5px;
    margin-bottom: 13px;
}

.campo:focus {
    outline: none;
    background: white;
    border-color: #0866ff;
}

.etiqueta {
    font-size: 13px;
    color: #606770;
    display: block;
    margin: 5px 0 8px;
}

.informacion {
    color: #65676b;
    font-size: 12px;
    line-height: 1.5;
    margin: 10px 0 20px;
}

.acciones {
    text-align: center;
}

.boton {
    background: #00a400;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px 28px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    min-width: 210px;
}

.boton:hover {
    background: #36a420;
}

.boton:disabled {
    opacity: .65;
    cursor: wait;
}

.volver {
    display: block;
    margin-top: 22px;
    color: #1877f2;
    font-size: 16px;
    text-decoration: none;
}

#resultado {
    text-align: center;
    font-size: 14px;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

.exito {
    color: #17803d;
}

.error {
    color: #c62828;
}

footer {
    padding: 24px;
    text-align: center;
    color: #737373;
    background: white;
    font-size: 12px;
}

@media(max-width: 460px) {
    .logo {
        font-size: 43px;
    }

    .tarjeta {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="aviso">
    SIMULACIÓN EDUCATIVA —
    No utilices información personal ni contraseñas reales.
</div>

<main class="principal">

    <a href="./index.html" class="logo">
        Facebook
    </a>

    <section class="tarjeta">

        <header class="encabezado">
            <h2>Crea una cuenta de prueba</h2>
            <p>Es rápido y fácil.</p>
        </header>

        <div class="contenido">

            <form id="registroDemoForm">

                <label
                    for="aliasRegistro"
                    class="etiqueta"
                >
                    Alias ficticio
                </label>

                <input
                    id="aliasRegistro"
                    class="campo"
                    type="text"
                    value="demo_alumno02"
                    placeholder="demo_alumno02"
                    pattern="demo_[A-Za-z0-9_]{1,35}"
                    maxlength="40"
                    autocomplete="off"
                    required
                >

                <p class="informacion">
                   --
                </p>

                <div class="acciones">

                    <button
                        type="submit"
                        class="boton"
                    >
                        Simular registro
                    </button>

                    <p id="resultado" role="status"></p>

                    <a
                        class="volver"
                        href="./index.html"
                    >
                        ¿Ya tienes una cuenta de prueba?
                    </a>

                </div>

            </form>

        </div>

    </section>

</main>

<footer>
    Proyecto académico de ciberseguridad · 2026
</footer>

<script src="./app.js"></script>

<script>
document.getElementById("registroDemoForm")
.addEventListener("submit", async function(evento) {

    evento.preventDefault();

    const alias =
        document.getElementById("aliasRegistro").value.trim();

    const resultado =
        document.getElementById("resultado");

    const boton =
        this.querySelector("button[type='submit']");

    boton.disabled = true;
    resultado.className = "";
    resultado.textContent = "Registrando evento ficticio...";

    try {
        const datos = await registrarEvento(
            "registro_demo",
            alias
        );

        resultado.className = "exito";
        resultado.textContent =
            "Registro ficticio guardado correctamente. ID: " +
            datos.id;

    } catch (error) {
        resultado.className = "error";
        resultado.textContent =
            "Error de conexión: " + error.message;
    } finally {
        boton.disabled = false;
    }
});
</script>

</body>
</html>
